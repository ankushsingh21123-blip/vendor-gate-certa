name: Verify portable runtime preparation
on:
  push:
    paths:
      - runtime_prep.py
      - .github/workflows/runtime-prep.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python runtime_prep.py
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_api -v
      - run: npm test
      - run: npm run build
      - run: python test_runtime.py
      - name: Verify image build only, not hosted persistence
        run: docker build -t vendor-gate-runtime-check .
      - name: Publish verified normal source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore .dockerignore Dockerfile DEPLOYMENT.md start.sh test_runtime.py api/index.py requirements.txt README.md
          git diff --cached --quiet || git commit -m 'Expand verified portable runtime and restart acceptance source'
          git push
