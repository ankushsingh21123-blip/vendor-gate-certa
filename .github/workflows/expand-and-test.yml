name: Expand original source and verify
on:
  push:
    paths:
      - .github/workflows/expand-and-test.yml
      - source_bundle.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract reviewed original source without overwriting existing paths
        run: |
          python source_bundle.py --extract /tmp/vendor-source
          python - <<'PY'
          import pathlib,shutil
          root=pathlib.Path('/tmp/vendor-source')
          for source in root.rglob('*'):
              if not source.is_file():continue
              target=pathlib.Path('.')/source.relative_to(root)
              if target.exists():
                  if target.read_bytes()!=source.read_bytes():shutil.copyfile(source,target)
              else:
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(source,target)
          PY
      - run: npm install --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_api -v
      - run: if [ -f worker/contract.test.mjs ]; then node --test worker/contract.test.mjs; fi
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
      - name: Publish expanded source tree only after verification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/.github/workflows/expand-and-test.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Expand reviewed Vendor Gate original source and test files'
          git push
